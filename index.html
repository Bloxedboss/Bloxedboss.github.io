<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectVault | My Projects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b16;color:#eef2ff;min-height:100vh;
}
header{
  padding:24px 7%;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #20263b;background:#0b1020;
}
.logo{font-size:25px;font-weight:800}
.logo span{color:#8b5cf6}
nav a{color:#b8c0d9;text-decoration:none;margin-left:22px}
.hero{text-align:center;padding:75px 20px 45px}
.badge{display:inline-block;padding:8px 14px;border:1px solid #3b3565;border-radius:30px;color:#a78bfa;background:#15122a;margin-bottom:20px}
h1{font-size:clamp(40px,7vw,72px);line-height:1.05}
.hero p{max-width:650px;margin:20px auto;color:#aab3ca;font-size:18px;line-height:1.6}
.search{
  width:min(700px,90%);margin:25px auto 0;display:flex;
  background:#11172a;border:1px solid #2a3350;border-radius:14px;padding:6px;
}
.search input{flex:1;background:transparent;border:0;outline:0;color:white;padding:15px;font-size:16px}
.search button,.download{
  border:0;border-radius:10px;padding:12px 18px;background:#7c3aed;color:white;
  cursor:pointer;font-weight:700;text-decoration:none;display:inline-block;
}
.container{width:min(1100px,90%);margin:auto;padding:20px 0 70px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0}
.section-title h2{font-size:28px}
.count{color:#8f9ab5}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.filter{
  background:#11172a;color:#aeb8d0;border:1px solid #2a3350;padding:9px 14px;
  border-radius:20px;cursor:pointer
}
.filter.active,.filter:hover{background:#25164a;color:#c4b5fd;border-color:#6d42c5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{
  background:linear-gradient(145deg,#11172a,#0d1221);border:1px solid #252d47;
  border-radius:18px;padding:20px;transition:.2s;
}
.card:hover{transform:translateY(-5px);border-color:#6941c6}
.icon{font-size:42px;margin-bottom:16px}
.card h3{font-size:21px;margin-bottom:9px}
.card p{color:#9da8c0;line-height:1.5;min-height:48px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}
.tag{font-size:12px;padding:5px 9px;border-radius:8px;background:#1b2238;color:#b8c4df}
footer{text-align:center;border-top:1px solid #20263b;padding:25px;color:#68738d}
.empty{text-align:center;padding:40px;color:#8994ac;display:none}
@media(max-width:600px){header{padding:20px 5%}nav{display:none}.hero{padding-top:55px}}
</style>
</head>
<body>

<header>
  <div class="logo">Project<span>Vault</span> 🚀</div>
  <nav><a href="#projects">Projects</a><a href="#about">About</a></nav>
</header>

<section class="hero">
  <div class="badge">MS Office Project Library</div>
  <h1>My Projects.<br><span style="color:#8b5cf6">Your Downloads.</span></h1>
  <p>A simple place to explore and download my Microsoft Office projects. More project categories can be added later.</p>

  <div class="search">
    <input id="search" type="text" placeholder="Search projects...">
    <button onclick="filterProjects()">Search</button>
  </div>
</section>

<main class="container" id="projects">
  <div class="section-title">
    <h2>My Projects</h2>
    <div class="count" id="count"></div>
  </div>

  <div class="filters">
    <button class="filter active" onclick="setCategory('All',this)">All</button>
    <button class="filter" onclick="setCategory('Word',this)">📝 Word</button>
    <button class="filter" onclick="setCategory('Excel',this)">📊 Excel</button>
    <button class="filter" onclick="setCategory('PowerPoint',this)">🎞️ PowerPoint</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No projects found.</div>
</main>

<footer id="about">
  © 2026 ProjectVault • Built for sharing projects
</footer>

<script>
const projects = [{
  name:"The Smart School Logo",
  category:"Word",
  icon:"📝",
  description:"A Microsoft Word project containing The Smart School logo.",
  file:"The Smart School Logo.docx"
},
  {
    name:"MS Word Office Automation Poster",
    category:"Word",
    icon:"📝",
    description:"A Microsoft Word project featuring an Office Automation themed design.",
    file:"#"
  },
  {
    name:"MS Word Watermark Design",
    category:"Word",
    icon:"📄",
    description:"A Word document design using shapes, text and watermark-style elements.",
    file:"#"
  },
  {
    name:"Excel Practice Project",
    category:"Excel",
    icon:"📊",
    description:"A sample Microsoft Excel project. Replace this with your own file later.",
    file:"#"
  },
  {
    name:"PowerPoint Presentation",
    category:"PowerPoint",
    icon:"🎞️",
    description:"A sample presentation project. Replace this with your own PowerPoint file.",
    file:"#"
  }
];

let category="All";

function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const filtered=projects.filter(p=>
    (category==="All"||p.category===category) &&
    (p.name.toLowerCase().includes(q)||p.description.toLowerCase().includes(q))
  );
  document.getElementById("count").textContent=filtered.length+" project"+(filtered.length===1?"":"s");
  const grid=document.getElementById("grid");
  grid.innerHTML=filtered.map(p=>`
    <article class="card">
      <div class="icon">${p.icon}</div>
      <h3>${p.name}</h3>
      <p>${p.description}</p>
      <div class="tags"><span class="tag">${p.category}</span><span class="tag">MS Office</span></div>
      <a class="download" href="${p.file}" ${p.file!=="#"?"download":""}>⬇ Download</a>
    </article>
  `).join("");
  document.getElementById("empty").style.display=filtered.length?"none":"block";
}
function setCategory(c,btn){
  category=c;
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  render();
}
function filterProjects(){render()}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
